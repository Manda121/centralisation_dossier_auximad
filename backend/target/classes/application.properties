# ============================================
# Configuration Serveur Auximad
# ============================================

server.port=8080

# JavaMail / SMTP : identifiants fournis par l'environnement du serveur.
spring.mail.host=${MAIL_HOST:}
spring.config.import=optional:file:./config/mail-local.properties,optional:file:./backend/config/mail-local.properties
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
app.mail.poll-delay=10000

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/dossier_auximad
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Schema gere par backend/bdd/base_centralisation.sql uniquement.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ---- JWT ----
jwt.secret=AuximadSecretKey2024CentralisationDossierApplicationSecure
jwt.expiration=86400000

# ---- Tentatives de connexion ----
login.max-tentatives=3
login.duree-suspension-minutes=15

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html

# logging.level.org.springframework.security=DEBUG

spring.jackson.serialization.fail-on-empty-beans=false

# ---- Upload fichiers documents ----
app.upload.dir=uploads/documents
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# ============================================
# Assistant conversationnel (Ollama local)
# ============================================
# Le modèle doit être installé au préalable : « ollama pull qwen2.5:3b »
# puis le service doit tourner : « ollama serve »
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:3b
# Température basse : on veut des réponses factuelles, pas créatives.
ollama.temperature=0.1
# Fenêtre de contexte : 16384 pour que le modèle choisisse correctement parmi les 20 outils.
ollama.num-ctx=16384
# Nombre max d'allers-retours outils par question (garde-fou anti-boucle).
ollama.max-iterations=6
# Les schémas d'outils sont volumineux : le timeout doit être generous.
ollama.timeout-seconds=300
