# ============================================
# Configuration Serveur Auximad
# ============================================

server.port=8080

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/dossier_auximad
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=AuximadSecretKey2024CentralisationDossierApplicationSecure
jwt.expiration=86400000

# ---- Tentatives de connexion ----
login.max-tentatives=3
login.duree-suspension-minutes=15

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html

# logging.level.org.springframework.security=DEBUG

spring.jackson.serialization.fail-on-empty-beans=false

# ---- Upload fichiers documents ----
app.upload.dir=uploads/documents
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
